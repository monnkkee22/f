<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Radar – neue Roblox Items</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef1f6;
    --panel: #ffffff;
    --ink: #101a33;
    --muted: #5d6882;
    --line: #d5dbe8;
    --signal: #ff4d2e;
    --signal-ink: #ffffff;
    --robux: #0a8f5b;
    --limited: #6b3df5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121a2e;
      --panel: #1b2540;
      --ink: #eef1fa;
      --muted: #9aa6c4;
      --line: #2c3a5e;
      --signal: #ff6a4d;
      --signal-ink: #1a0b07;
      --robux: #3ed38f;
      --limited: #a58bff;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font: 400 16px/1.5 "Instrument Sans", system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }

  header { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
    font-size: clamp(2.2rem, 7vw, 3.8rem); line-height: .95; letter-spacing: -.03em; margin: 0;
  }
  .sub { color: var(--muted); margin: 10px 0 0; max-width: 46ch; }

  .notify {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  button {
    font: 600 15px "Instrument Sans", sans-serif; cursor: pointer; border-radius: 10px;
    border: 2px solid var(--ink); background: transparent; color: var(--ink); padding: 10px 16px;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  button.on { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
  button.on:hover { filter: brightness(.95); background: var(--signal); color: var(--signal-ink); }
  .status { font-size: 13px; color: var(--muted); text-align: right; max-width: 30ch; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 14px; flex-wrap: wrap; }
  .tabs { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tabs button { border: 0; border-radius: 8px; padding: 8px 16px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--robux); }
  .dot.err { background: var(--signal); }
  @media (prefers-reduced-motion: no-preference) {
    .dot.pulse { animation: ping 1.4s ease-out 1; }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 var(--robux); } 100% { box-shadow: 0 0 0 10px transparent; } }
  }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li a {
    display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px 12px 12px; color: inherit; text-decoration: none;
  }
  li a:hover { border-color: var(--ink); }
  li.fresh a { border-color: var(--signal); box-shadow: inset 4px 0 0 var(--signal); }
  .thumb { width: 72px; height: 72px; border-radius: 10px; background: var(--paper); object-fit: cover; }
  .name { font-weight: 600; line-height: 1.25; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); }
  .tag.limited { color: var(--limited); border-color: var(--limited); }
  .tag.new { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
  .price { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.35rem; color: var(--robux); text-align: right; white-space: nowrap; }
  .price small { display: block; font: 500 12px "Instrument Sans", sans-serif; color: var(--muted); }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { margin-top: 36px; color: var(--muted); font-size: 13px; }

  @media (max-width: 520px) {
    li a { grid-template-columns: 56px 1fr; }
    .thumb { width: 56px; height: 56px; }
    .price { grid-column: 2; text-align: left; }
    .notify { align-items: flex-start; }
    .status { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Drop Radar</h1>
      <p class="sub">Neue Roblox Limiteds und frisch veröffentlichte Items. Lass den Tab offen und Chrome meldet sich, sobald etwas Neues erscheint.</p>
    </div>
    <div class="notify">
      <button id="notifyBtn" type="button">Benachrichtigungen aktivieren</button>
      <div class="status" id="notifyStatus" role="status"></div>
    </div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Ansicht">
      <button role="tab" id="tab-limited" aria-selected="true" data-mode="limited">Limiteds</button>
      <button role="tab" id="tab-new" aria-selected="false" data-mode="new">Alle neuen Items</button>
    </div>
    <div class="live"><span class="dot" id="dot"></span><span id="liveText">Lade…</span></div>
  </div>

  <ul id="list" aria-live="polite"></ul>

  <footer>Prüft alle 30 Sekunden. Daten von der öffentlichen Roblox-Katalog-API. Nicht von Roblox betrieben.</footer>
</div>

<script>
(() => {
  const POLL_MS = 30000;
  const $ = (s) => document.querySelector(s);
  const list = $('#list'), dot = $('#dot'), liveText = $('#liveText');
  const btn = $('#notifyBtn'), statusEl = $('#notifyStatus');

  let mode = 'limited';
  let swReg = null;
  const baseTitle = document.title;
  let unseenCount = 0;
  let freshIds = new Set();

  // ---------- Storage (try/catch, kann leer sein) ----------
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  // ---------- Notifications ----------
  const wantsNotify = () => load('notify', false) && 'Notification' in window && Notification.permission === 'granted';

  function renderNotifyUi() {
    if (!('Notification' in window)) {
      btn.disabled = true; btn.textContent = 'Nicht unterstützt';
      statusEl.textContent = 'Dieser Browser unterstützt keine Benachrichtigungen.'; return;
    }
    if (Notification.permission === 'denied') {
      btn.disabled = true; btn.textContent = 'Blockiert';
      statusEl.textContent = 'In Chrome blockiert: Schloss-Symbol in der Adressleiste → Benachrichtigungen erlauben.'; return;
    }
    const on = wantsNotify();
    btn.classList.toggle('on', on);
    btn.textContent = on ? 'Benachrichtigungen an' : 'Benachrichtigungen aktivieren';
    statusEl.textContent = on ? 'Klicken zum Ausschalten.' : '';
  }

  btn.addEventListener('click', async () => {
    if (wantsNotify()) { save('notify', false); renderNotifyUi(); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      save('notify', true);
      renderNotifyUi();
      notify('Drop Radar ist aktiv', 'Du bekommst eine Meldung, sobald ein neues Item erscheint. Klick öffnet Roblox.', '', 'https://www.roblox.com/catalog');
    } else {
      renderNotifyUi();
    }
  });

  async function notify(title, body, icon, url, tag) {
    const opts = { body, icon: icon || undefined, data: { url }, tag: tag || undefined };
    try {
      if ('serviceWorker' in navigator) {
        const reg = swReg || (await navigator.serviceWorker.ready);
        await reg.showNotification(title, opts);
        return;
      }
    } catch {}
    try {
      const n = new Notification(title, opts);
      n.onclick = () => { window.open(url, '_blank', 'noopener'); n.close(); };
    } catch {}
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then((r) => (swReg = r)).catch(() => {});
  }

  // ---------- Rendering ----------
  const fmt = new Intl.NumberFormat('de-DE');

  function itemHtml(i) {
    const price = i.free ? 'Gratis' : i.price != null ? fmt.format(i.price) : '–';
    const stock = i.limited && i.total ? `${fmt.format(i.left ?? 0)} von ${fmt.format(i.total)} übrig` : '';
    const el = document.createElement('li');
    if (freshIds.has(i.id)) el.classList.add('fresh');
    const a = document.createElement('a');
    a.href = i.url; a.target = '_blank'; a.rel = 'noopener';

    const img = document.createElement('img');
    img.className = 'thumb'; img.alt = ''; img.loading = 'lazy';
    if (i.thumb) img.src = i.thumb;

    const mid = document.createElement('div');
    const name = document.createElement('div'); name.className = 'name'; name.textContent = i.name;
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = [i.creator && 'von ' + i.creator, stock].filter(Boolean).join(' – ');
    const tags = document.createElement('div'); tags.className = 'tags';
    if (freshIds.has(i.id)) tags.insertAdjacentHTML('beforeend', '<span class="tag new">Neu</span>');
    if (i.limited) tags.insertAdjacentHTML('beforeend', '<span class="tag limited">Limited</span>');
    if (i.type === 'Bundle') tags.insertAdjacentHTML('beforeend', '<span class="tag">Bundle</span>');
    mid.append(name, meta, tags);

    const p = document.createElement('div'); p.className = 'price';
    p.innerHTML = `${price}<small>${i.free || i.price == null ? '' : 'Robux'}</small>`;

    a.append(img, mid, p);
    el.append(a);
    return el;
  }

  function render(items) {
    list.replaceChildren();
    if (!items.length) {
      list.innerHTML = '<li class="empty">Gerade keine Items gefunden. Die Seite sucht weiter.</li>';
      return;
    }
    items.forEach((i) => list.append(itemHtml(i)));
  }

  // ---------- Polling ----------
  async function check(isModeSwitch = false) {
    const key = 'seen:' + mode;
    try {
      const r = await fetch('/api/items?mode=' + mode, { cache: 'no-store' });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { const err = new Error(data.error || r.status); err.errors = data.errors; throw err; }
      const items = data.items || [];
      const seen = load(key, null);              // null = erster Besuch
      const ids = items.map((i) => i.id);

      let fresh = [];
      if (seen) fresh = items.filter((i) => !seen.includes(i.id));
      freshIds = new Set([...(isModeSwitch ? [] : freshIds), ...fresh.map((i) => i.id)]);

      // Baseline: gemerkt werden die letzten 200 IDs
      save(key, Array.from(new Set([...ids, ...(seen || [])])).slice(0, 200));

      render(items);
      dot.classList.remove('err'); dot.classList.add('pulse');
      setTimeout(() => dot.classList.remove('pulse'), 1500);
      liveText.textContent = (data.stale ? 'Zwischenstand vom ' : 'Zuletzt geprüft ') + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      if (fresh.length && wantsNotify() && !isModeSwitch) {
        if (fresh.length === 1) {
          const f = fresh[0];
          notify(
            (f.limited ? 'Neues Limited: ' : 'Neues Item: ') + f.name,
            f.free ? 'Gratis' : f.price != null ? fmt.format(f.price) + ' Robux' : 'Jetzt ansehen',
            f.thumb, f.url, 'item-' + f.id
          );
        } else {
          notify(`${fresh.length} neue Items`, fresh.slice(0, 3).map((f) => f.name).join(', '), fresh[0].thumb, fresh[0].url, 'multi-' + Date.now());
        }
      }
      if (fresh.length && document.hidden) {
        unseenCount += fresh.length;
        document.title = `(${unseenCount}) ${baseTitle}`;
      }
    } catch (e) {
      dot.classList.add('err');
      const d = (e.errors && e.errors[0]) || e.message || '';
      liveText.textContent = 'Roblox antwortet gerade nicht (' + d + '). Neuer Versuch folgt.';
      console.warn('API-Fehler', e.errors || e);
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { unseenCount = 0; document.title = baseTitle; }
  });

  document.querySelectorAll('[role=tab]').forEach((t) =>
    t.addEventListener('click', () => {
      mode = t.dataset.mode;
      document.querySelectorAll('[role=tab]').forEach((x) => x.setAttribute('aria-selected', x === t));
      list.replaceChildren(); liveText.textContent = 'Lade…';
      check(true);
    })
  );

  renderNotifyUi();
  check(true);
  setInterval(check, POLL_MS);
})();
</script>
</body>
</html>
